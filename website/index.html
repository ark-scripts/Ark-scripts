<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Segoe UI, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 30%);
            filter: blur(30px);
        }

        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 750px;
            text-align: center;

            background: rgba(18,18,18,0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;

            padding: 60px 40px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 0 50px rgba(255,255,255,0.05),
                inset 0 0 0 1px rgba(255,255,255,0.02);
        }

        .logo {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9c9c9c;
            font-size: 1.1rem;
            margin-bottom: 50px;
        }

        .key-btn {
            background: white;
            color: black;
            border: none;
            border-radius: 18px;

            font-size: 1.4rem;
            font-weight: 700;

            padding: 22px 60px;

            cursor: pointer;
            transition: all .25s ease;
        }

        .key-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,255,255,0.15);
        }

        .key-btn:active {
            transform: scale(.97);
        }

        .footer {
            margin-top: 35px;
            color: #6b6b6b;
            font-size: .9rem;
        }

        .line {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, white, transparent);
            margin: 30px auto;
            opacity: .4;
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="card">
        <h1 class="logo">ArkHub Key System</h1>

        <p class="subtitle">
            Premium Roblox Script Experience
        </p>

        <div class="line"></div>

        <button class="key-btn" onclick="getKey()">
            Get Key!
        </button>

        <div class="footer">
            Secure • Fast • Reliable
        </div>
    </div>

    <script>
        function getKey() {
            const random = Math.random();

            if (random < 0.51) {
                window.location.href =
                    "https://work.ink/2FUW/Ark-Scripts";
            } if (random > 0.50) {
                window.location.href =
                    "https://work.ink/2FQm/ark-hub";
            }
        }
    </script>

</body>
</html>
